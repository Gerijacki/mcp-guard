name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, move the major tag
      packages: write # push the image to GHCR
      id-token: write # sign build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance (archives, SBOMs, checksums)
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Resolve the image digest
        id: image
        run: |
          ref="ghcr.io/gerijacki/mcp-guard:${GITHUB_REF_NAME#v}"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (container image)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/gerijacki/mcp-guard
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Move the major version tag (e.g. v0) for the GitHub Action
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

  smoke-test:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify provenance of a release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'mcp-guard_linux_amd64.tar.gz*'
          test -s mcp-guard_linux_amd64.tar.gz.sbom.json
          gh attestation verify mcp-guard_linux_amd64.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: install.sh
        env:
          MCP_GUARD_VERSION: ${{ github.ref_name }}
        run: |
          BIN_DIR="$HOME/.local/bin" sh install.sh
          "$HOME/.local/bin/mcp-guard" version
          set +e
          "$HOME/.local/bin/mcp-guard" scan examples/vulnerable-server --no-color
          test $? -eq 1
      - name: Log in to GHCR
        if: runner.os == 'Linux'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gh attestation verify "oci://ghcr.io/gerijacki/mcp-guard:$tag" --repo "$GITHUB_REPOSITORY"
          docker run --rm "ghcr.io/gerijacki/mcp-guard:$tag" version
          set +e
          docker run --rm -v "$PWD/examples/vulnerable-server:/src" "ghcr.io/gerijacki/mcp-guard:$tag"
          test $? -eq 1
