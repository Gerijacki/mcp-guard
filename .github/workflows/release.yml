name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, move the major tag
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the major version tag (e.g. v0) for the GitHub Action
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"

  smoke-test:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        env:
          MCP_GUARD_VERSION: ${{ github.ref_name }}
        run: |
          BIN_DIR="$HOME/.local/bin" sh install.sh
          "$HOME/.local/bin/mcp-guard" version
          set +e
          "$HOME/.local/bin/mcp-guard" scan examples/vulnerable-server --no-color
          test $? -eq 1
      - name: Log in to GHCR
        if: runner.os == 'Linux'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker image
        if: runner.os == 'Linux'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          docker run --rm "ghcr.io/gerijacki/mcp-guard:$tag" version
          set +e
          docker run --rm -v "$PWD/examples/vulnerable-server:/src" "ghcr.io/gerijacki/mcp-guard:$tag"
          test $? -eq 1
