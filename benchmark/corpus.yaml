# Real-world accuracy benchmark. Run with: go run ./tools/accuracy
#
# Each entry pins a public MCP repository at a commit and records what mcp-guard is
# expected to find there with default settings (tests skipped, min severity low).
# A change in any number fails CI: if the change is an intended improvement, review
# the new findings and refresh the expectations with: go run ./tools/accuracy -update
#
# Every finding must be labelled tp (real problem) or fp (false positive) with a note;
# -update adds new findings as "todo" and fails until a human reviews them. CI gates the
# per-rule precision on these labels. known-gaps lists real vulnerabilities we miss.
repos:
    - name: modelcontextprotocol/servers
      commit: f46d9578190b476b3501923ea8977d899e8db2cb
      expect:
        tools: 31
        configs: 1
        findings:
            MCPG006: 3
            MCPG008: 2
            MCPG009: 2
      labels:
        - rule: MCPG008
          file: src/everything/transports/sse.ts
          label: tp
          note: Express app.listen(PORT) binds every interface; no auth anywhere. Reference/demo server, but the pattern is real.
        - rule: MCPG008
          file: src/everything/transports/streamableHttp.ts
          label: tp
          note: 'Same as sse.ts: app.listen(PORT) on all interfaces, no authentication.'
        - rule: MCPG006
          file: src/memory/index.ts
          tool: delete_entities
          label: tp
          note: Annotated destructiveHint but no confirmation or limit. By design for a memory server, within the rule's definition.
        - rule: MCPG006
          file: src/memory/index.ts
          tool: delete_observations
          label: tp
          note: Same as delete_entities.
        - rule: MCPG006
          file: src/memory/index.ts
          tool: delete_relations
          label: tp
          note: Same as delete_entities.
        - rule: MCPG009
          file: src/fetch/src/mcp_server_fetch/server.py
          tool: call_tool (via check_may_autonomously_fetch_url)
          label: tp
          note: The fetch server requests whatever URL the model gives it and follows redirects, by design (its README warns about internal addresses). Detected through the fetch_url helper.
        - rule: MCPG009
          file: src/fetch/src/mcp_server_fetch/server.py
          tool: call_tool (via fetch_url)
          label: tp
          note: The fetch server requests whatever URL the model gives it and follows redirects, by design (its README warns about internal addresses). Detected through the fetch_url helper.
