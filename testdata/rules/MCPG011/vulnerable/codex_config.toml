# Codex CLI configuration
model = "gpt-5"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]   # unpinned
env = { "GITHUB_TOKEN" = "${GITHUB_TOKEN}" }

[mcp_servers.docs]
url = "http://docs.vendor.dev/mcp"

[mcp_servers.db]
command = "docker"
args = [
  "run", "-i", "--rm",
  "acme/db-mcp:2.0.1",
]

[mcp_servers.db.env]
DB_DSN = "${DB_DSN}"
