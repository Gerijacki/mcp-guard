name: mcp-guard
description: Security linter for MCP (Model Context Protocol) servers. Finds command injection, path traversal, secrets, tool poisoning and more.
author: mcp-guard contributors
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: File or directory to scan.
    default: "."
  fail-on:
    description: Fail the step when a finding has at least this severity (critical, high, medium, low, info, none).
    default: high
  min-severity:
    description: Hide findings below this severity.
    default: low
  upload-sarif:
    description: "Upload results to GitHub code scanning (requires the security-events: write permission)."
    default: "true"
  sarif-file:
    description: Where to write the SARIF report.
    default: mcp-guard.sarif
  args:
    description: Extra arguments for `mcp-guard scan` (e.g. "--disable MCPG006 --include-tests").
    default: ""
  version:
    description: mcp-guard release to use (e.g. v0.1.0), "latest", or "source" to build the action's own checkout (requires Go on the runner).
    default: latest

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Install mcp-guard
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/mcp-guard"
        mkdir -p "$dir"
        if [ "$VERSION" = source ]; then
          (cd "$ACTION_PATH" && go build -o "$dir/" ./cmd/mcp-guard)
          echo "$dir" >> "$GITHUB_PATH"
          exit 0
        fi
        case "${RUNNER_OS}" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "unsupported runner OS: ${RUNNER_OS}"; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported runner arch: ${RUNNER_ARCH}"; exit 1 ;;
        esac
        ext=tar.gz; [ "$os" = windows ] && ext=zip
        asset="mcp-guard_${os}_${arch}.${ext}"
        if [ "$VERSION" = latest ]; then
          url="https://github.com/Gerijacki/mcp-guard/releases/latest/download/${asset}"
        else
          url="https://github.com/Gerijacki/mcp-guard/releases/download/${VERSION}/${asset}"
        fi
        curl -fsSL "$url" -o "$dir/$asset"
        curl -fsSL "${url%/*}/checksums.txt" -o "$dir/checksums.txt"
        expected="$(grep " ${asset}\$" "$dir/checksums.txt" | cut -d ' ' -f 1)"
        [ -n "$expected" ] || { echo "no checksum for ${asset} in checksums.txt"; exit 1; }
        if command -v sha256sum >/dev/null 2>&1; then actual="$(sha256sum "$dir/$asset" | cut -d ' ' -f 1)"
        else actual="$(shasum -a 256 "$dir/$asset" | cut -d ' ' -f 1)"; fi
        [ "$expected" = "$actual" ] || { echo "checksum mismatch for ${asset}: expected ${expected}, got ${actual}"; exit 1; }
        if [ "$ext" = zip ]; then unzip -q -o "$dir/$asset" -d "$dir"; else tar -xzf "$dir/$asset" -C "$dir"; fi
        echo "$dir" >> "$GITHUB_PATH"

    - name: Scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        # One scan produces the SARIF file, the step summary and the exit code. The exit
        # code is kept so that the SARIF upload still runs when findings fail the step.
        set +e
        summary="${RUNNER_TEMP}/mcp-guard.md"
        read -r -a extra <<< "$EXTRA_ARGS"   # whitespace-separated; no globbing
        mcp-guard scan "$SCAN_PATH" --no-color --min-severity "$MIN_SEVERITY" --fail-on "$FAIL_ON" \
          --format text --also "sarif=${SARIF_FILE}" --also "markdown=${summary}" "${extra[@]}"
        code=$?
        {
          echo '<details open><summary>mcp-guard report</summary>'
          echo
          cat "$summary" 2>/dev/null
          echo
          echo '</details>'
        } >> "$GITHUB_STEP_SUMMARY"
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.code != '2' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: mcp-guard

    - name: Fail on findings
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.code }}
      run: exit "${CODE:-2}"
